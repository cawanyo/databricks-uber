# The main pipeline for i

resources:
  pipelines:
    etl:
      name: etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      configuration:
        namespace: uber-data-namespace
        name: uber-topic
        env: dev

      serverless: true
      root_path: "../pipelines/elt"

      libraries:
        - glob:
            include: ../pipelines/elt/transformations/**

    
